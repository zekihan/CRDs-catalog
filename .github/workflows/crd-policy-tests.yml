name: CRD policy tests
on:
  push:
    branches: [main]
    paths: ['.github/scripts/**', '.github/workflows/crd-*.yml', 'Utilities/openapi2jsonschema.py', 'Utilities/refresh-crds-catalog.py', 'Utilities/patches/**', 'Utilities/tests/**']
  pull_request:
    paths: ['.github/scripts/**', '.github/workflows/crd-*.yml', 'Utilities/openapi2jsonschema.py', 'Utilities/refresh-crds-catalog.py', 'Utilities/patches/**', 'Utilities/tests/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes --only-binary=":all:" -r .github/scripts/requirements.txt
      - run: python -m unittest discover -s .github/scripts/tests -v
      - run: python -m unittest discover -s Utilities/tests -v
